<!DOCTYPE html>
<html>
<head>
<title>EduConnect</title>

<style>
body{font-family:Arial;margin:0;background:#e8f5e9}
header{background:#2e7d32;color:white;text-align:center;padding:25px}
nav{background:#43a047;padding:15px;text-align:center}
nav a{color:white;margin:15px;text-decoration:none;font-weight:bold}
.box{background:white;margin:20px;padding:20px;border-radius:10px}

<body>

<nav>
<a href="#">Home</a>

<a href="#">Students</a>

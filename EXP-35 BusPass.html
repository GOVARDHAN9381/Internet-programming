<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Bus Pass & e-Ticket Renewal System</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #064e3b; color: #ecfdf5; min-height: 100vh; padding-bottom: 40px; }
    header { background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 30px 20px; text-align: center; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3); }
    header h1 { font-size: 28px; font-weight: 800; text-transform: uppercase; }
    nav { display: flex; justify-content: center; background: #022c22; padding: 12px; gap: 12px; border-bottom: 1px solid #065f46; }
    nav button { background: #065f46; color: #a7f3d0; border: 1px solid #047857; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: 700; transition: 0.3s; }
    nav button.active, nav button:hover { background: linear-gradient(135deg, #34d399, #10b981); color: #064e3b; border-color: transparent; box-shadow: 0 0 15px rgba(52, 211, 153, 0.4); transform: translateY(-2px); }
    .container { max-width: 900px; margin: 30px auto; padding: 0 15px; }
    .card { background: #022c22; border: 1px solid #065f46; border-radius: 16px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: none; }
    .card.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    h2 { color: #34d399; margin-bottom: 20px; border-bottom: 2px solid #065f46; padding-bottom: 10px; font-weight: 800; }
    input, select { width: 100%; padding: 12px 16px; margin: 8px 0; border: 1px solid #047857; border-radius: 8px; background: #064e3b; color: white; font-size: 14px; outline: none; }
    button.btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; background: linear-gradient(135deg, #10b981, #059669); color: white; font-weight: 800; cursor: pointer; transition: 0.3s; }
    button.btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(16,185,129,0.4); }
    .qr-card { background: #064e3b; border: 2px dashed #10b981; border-radius: 16px; padding: 25px; text-align: center; margin-top: 20px; }
  </style>
</head>
<body>

  <header>
    <h1>🚌 City Transport Bus Pass & e-Ticket System</h1>
    <p>Student Pass, Route Passes, Monthly Renewal & Conductor Scanner</p>
  </header>

  <nav>
    <button class="active" onclick="switchTab('pass')">Apply / Renew Pass</button>
    <button onclick="switchTab('conductor')">Conductor Verification</button>
    <button onclick="switchTab('admin')">Admin Pass Control</button>
  </nav>

  <div class="container">
    <!-- APPLY / RENEW -->
    <div id="pass" class="card active">
      <h2>💳 Student & Route Bus Pass Application</h2>
      <form onsubmit="event.preventDefault(); applyBusPass();">
        <input type="text" id="stuName" placeholder="Applicant Name" required>
        <select id="pCategory" required>
          <option value="Student Pass (Free / Discounted)">Government Student Pass (Free)</option>
          <option value="Route Bus Pass (₹600/month)">Working Professional Route Pass (₹600/mo)</option>
        </select>
        <input type="text" id="routeCode" placeholder="Route (e.g. Route #12: Central to Campus)" required>
        <button type="submit" class="btn">🎫 Generate Digital Bus Pass</button>
      </form>

      <div class="qr-card" id="passQR" style="display:none;">
        <h3 style="color:#34d399;">🎫 Active Digital Bus Pass</h3>
        <p id="qrData" style="font-family:monospace; font-size:18px; font-weight:800; color:#6ee7b7; margin:15px 0; background:#022c22; padding:12px; border-radius:8px; display:inline-block;"></p>
        <div><span style="background:#10b981; color:white; padding:6px 14px; border-radius:20px; font-weight:800; font-size:13px;">ACTIVE VALIDITY: 30 DAYS</span></div>
      </div>
    </div>

    <!-- CONDUCTOR -->
    <div id="conductor" class="card">
      <h2>🔍 Conductor Pass QR Scanner</h2>
      <input type="text" id="cScan" placeholder="Enter or Scan Pass ID">
      <button class="btn" style="background:linear-gradient(135deg, #059669, #047857);" onclick="scanPass()">🔓 Verify Bus Pass</button>
      <div id="scanResult" style="margin-top:20px; padding:15px; border-radius:10px; font-weight:800; display:none; text-align:center;"></div>
    </div>

    <!-- ADMIN -->
    <div id="admin" class="card">
      <h2>🛠️ Admin Route & Pass Management</h2>
      <div style="background:#064e3b; padding:20px; border-radius:12px; border:1px solid #047857;">
        <h3>Add New Transport Route</h3>
        <input type="text" id="rFromTo" placeholder="From - To Location">
        <input type="text" id="rTiming" placeholder="Bus Timings & Frequencies">
        <button class="btn" onclick="addRoute()">➕ Register Route</button>
      </div>
    </div>
  </div>

  <script>
    function switchTab(id) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.target.classList.add('active');
    }
    function applyBusPass() {
      let name = document.getElementById('stuName').value;
      let cat = document.getElementById('pCategory').value;
      let passId = 'BP-' + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('qrData').innerText = `[QR: ${passId} | ${name} | ${cat}]`;
      document.getElementById('passQR').style.display = 'block';
      alert(`Bus Pass ${passId} Generated Successfully for ${name}!`);
    }
    function scanPass() {
      let code = document.getElementById('cScan').value;
      let res = document.getElementById('scanResult');
      res.style.display = 'block';
      if (code.length > 3) {
        res.style.background = 'rgba(16, 185, 129, 0.2)'; res.style.color = '#34d399'; res.style.border = '1px solid #10b981';
        res.innerText = `✅ PASS VERIFIED: ${code} — Valid Bus Passholder!`;
      } else {
        res.style.background = 'rgba(239, 68, 68, 0.2)'; res.style.color = '#f87171'; res.style.border = '1px solid #ef4444';
        res.innerText = `❌ INVALID PASS! Ticket Fee Applicable.`;
      }
    }
    function addRoute() {
      let ft = document.getElementById('rFromTo').value;
      if (ft) alert(`Route "${ft}" created!`);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Online Bus Pass</title>

<style>
body{font-family:Arial;margin:0;background:#e0f7fa}
header{background:#00838f;color:white;text-align:center;padding:25px}
nav{background:#00acc1;padding:15px;text-align:center}
nav a{color:white;margin:15px;text-decoration:none;font-weight:bold}
.box{background:white;margin:20px;padding:20px;border-radius:10px}
h2{color:#00838f}
button{background:#ff6f00;color:white;border:0;padding:10px}
</style>
</head>

<body>

<header>
<h1>🚌 Online Bus Pass</h1>
<p>Easy and Fast Bus Pass Service</p>
</header>

<nav>
<a href="#">Home</a>
<a href="#">Register</a>
<a href="#">Bus Details</a>
<a href="#">Routes</a>
<a href="#">Renewal</a>
</nav>

<div class="box">

<h2>Apply Bus Pass</h2>

<form>
Name: <input type="text"><br><br>
Address: <input type="text"><br><br>
Date of Birth: <input type="date"><br><br>
Email: <input type="email"><br><br>

Route:
<select>
<option>Chennai - Tambaram</option>
<option>Chennai - Avadi</option>
</select><br><br>

Validity:
<select>
<option>1 Month</option>
<option>3 Months</option>
<option>6 Months</option>
</select><br><br>

<button>Apply</button>
</form>

</div>

<div class="box">

<h2>Bus Routes</h2>

<table border="1" cellpadding="10">
<tr><th>Bus</th><th>Route</th><th>Time</th></tr>
<tr><td>101</td><td>Chennai - Tambaram</td><td>8 AM</td></tr>
<tr><td>102</td><td>Chennai - Avadi</td><td>9 AM</td></tr>
</table>

</div>

</body>
</html>o

<html>
<head>
<title>Beauty Parlour Booking</title>
</head>
<body>
<h1>Beauty Parlour Appointment Booking</h1>
<div >
<h2>Register / Login</h2>
<input type="text" placeholder="Name">
<input type="email" placeholder="Email">
<input type="password" placeholder="Password"><br>
<button>Register</button>
<button>Login</button>
</div>
<div >
<h2>Book Appointment</h2>
<select>
<option>Hair Cut</option>
<option>Facial</option>
<option>Hair Spa</option>
<option>Makeup</option>
</select>
<select>
<option>Stylist A</option>
<option>Stylist B</option>
<option>Stylist C</option>
</select><br>
<input type="date">
<input type="time"><br>
<button>Book Now</button>
</div>
<div >
<h2>Reservations Calendar</h2>
<p>Available Time: 10:00 AM - 6:00 PM</p>
<p>Unavailable Hours: 1:00 PM - 2:00 PM</p>
</div>
<div >
<h2>My Reservations</h2>
<table>
<tr>
<th>ID</th>
<th>Service</th>
<th>Date</th>
<th>Status</th>
</tr>
<tr>
<td>101</td>
<td>Hair Spa</td>
<td>25-07-2026</td>
<td>Confirmed</td>
</tr>
</table>
<button>Edit</button>
<button>Cancel</button>
</div>
<div >
<h2>Payment</h2>
<select>
<option>PayPal</option>
<option>Stripe</option>
<option>Credit Card</option>
</select>
<button>Pay Now</button>
</div>
</body>
</html>

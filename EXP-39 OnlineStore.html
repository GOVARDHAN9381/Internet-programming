<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniStore - E-Commerce Catalog & Cart</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding-bottom: 40px; }
    header { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; padding: 30px 20px; text-align: center; box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4); }
    header h1 { font-size: 28px; font-weight: 800; text-transform: uppercase; }
    nav { display: flex; justify-content: center; background: #1e293b; padding: 12px; gap: 12px; border-bottom: 1px solid #334155; }
    nav button { background: #334155; color: #c7d2fe; border: 1px solid #6366f1; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: 700; transition: 0.3s; }
    nav button.active, nav button:hover { background: linear-gradient(135deg, #818cf8, #6366f1); color: white; border-color: transparent; box-shadow: 0 0 15px rgba(129, 140, 248, 0.4); transform: translateY(-2px); }
    .container { max-width: 900px; margin: 30px auto; padding: 0 15px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: none; }
    .card.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    h2 { color: #818cf8; margin-bottom: 20px; border-bottom: 2px solid #334155; padding-bottom: 10px; font-weight: 800; }
    input { width: 100%; padding: 12px 16px; margin: 8px 0; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: white; font-size: 14px; outline: none; }
    button.btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; font-weight: 800; cursor: pointer; transition: 0.3s; }
    button.btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(99,102,241,0.4); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
    .item-card { border: 1px solid #334155; border-radius: 12px; padding: 20px; background: #0f172a; text-align: center; }
    .price { font-size: 22px; font-weight: 800; color: #818cf8; margin: 10px 0; }
  </style>
</head>
<body>

  <header>
    <h1>🛍️ OmniStore E-Commerce Catalog</h1>
    <p>Premium Tech Accessories & Electronics Delivered Express</p>
  </header>

  <nav>
    <button class="active" onclick="switchTab('catalog')">Product Catalog</button>
    <button onclick="switchTab('cart')">Cart & Checkout (<span id="cartCnt">0</span>)</button>
  </nav>

  <div class="container">
    <!-- CATALOG -->
    <div id="catalog" class="card active">
      <h2>📦 Browse Catalog Items</h2>
      <input type="text" id="srch" placeholder="Search catalog..." onkeyup="filterItems()">
      <div class="grid" id="itemGrid">
        <div class="item-card" data-name="Wireless Noise-Canceling Headphones">
          <h3>🎧 Wireless Headphones</h3>
          <p style="color:#94a3b8; font-size:13px; margin-top:5px;">Bluetooth 5.2 • 30h Battery</p>
          <div class="price">₹ 2,999</div>
          <button class="btn" onclick="addItem('Wireless Headphones', 2999)">🛒 Add to Cart</button>
        </div>
        <div class="item-card" data-name="Smart Fitness Watch">
          <h3>⌚ Smart Fitness Watch</h3>
          <p style="color:#94a3b8; font-size:13px; margin-top:5px;">Heart Rate & Sleep Tracker</p>
          <div class="price">₹ 1,899</div>
          <button class="btn" onclick="addItem('Smart Fitness Watch', 1899)">🛒 Add to Cart</button>
        </div>
      </div>
    </div>

    <!-- CART -->
    <div id="cart" class="card">
      <h2>🛒 Shopping Cart Summary</h2>
      <div id="cartItems" style="color:#c7d2fe;">Cart is empty.</div>
      <p style="font-size:20px; font-weight:800; margin:15px 0; color:#818cf8;">Total Amount: ₹ <span id="cartSum">0</span></p>
      <input type="text" id="custAddress" placeholder="Enter Full Shipping Address">
      <button class="btn" style="background:linear-gradient(135deg, #10b981, #059669);" onclick="placeOrder()">💳 Complete Order & Pay</button>
    </div>
  </div>

  <script>
    let cart = [];
    function switchTab(id) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.target.classList.add('active');
    }
    function addItem(name, price) {
      cart.push({ name, price });
      updateUI();
      alert(`${name} added to cart!`);
    }
    function updateUI() {
      document.getElementById('cartCnt').innerText = cart.length;
      let div = document.getElementById('cartItems');
      let sum = 0;
      if (cart.length === 0) div.innerText = 'Cart is empty.';
      else {
        div.innerHTML = cart.map((c, i) => `<div>${i+1}. ${c.name} - ₹${c.price} <button onclick="removeItem(${i})" style="color:#ef4444; background:none; border:none; cursor:pointer; font-weight:bold;">[Remove]</button></div>`).join('');
        sum = cart.reduce((a, b) => a + b.price, 0);
      }
      document.getElementById('cartSum').innerText = sum;
    }
    function removeItem(idx) {
      cart.splice(idx, 1);
      updateUI();
    }
    function placeOrder() {
      let addr = document.getElementById('custAddress').value;
      if (cart.length > 0 && addr) {
        alert(`Order Placed! Delivering to: ${addr}`);
        cart = []; updateUI();
      } else alert('Please add items and enter address!');
    }
    function filterItems() {
      let q = document.getElementById('srch').value.toLowerCase();
      document.querySelectorAll('.item-card').forEach(c => {
        let n = c.getAttribute('data-name').toLowerCase();
        c.style.display = n.includes(q) ? 'block' : 'none';
      });
    }
  </script>
</body>
</html>
